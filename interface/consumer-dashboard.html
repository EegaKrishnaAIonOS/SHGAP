<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi - An innovative SHG intelligent assistant</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chatbot-widget.css" />
  </head>
  <body class="shg-page">
    <header class="shg-navbar">
      <div class="shg-navbar-inner">
        <div class="shg-greeting">
          <span class="shg-greeting-word">hello,</span>
          <span class="shg-brand">Anamika</span>
        </div>
        <img
          class="shg-avatar"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRQ2c7Xyvn2hZVZ4CFSOsRNJJXnZ2X3prKrNgDCs7ICg&s"
          alt="User profile"
          title="Anamika"
        />
      </div>
    </header>

    <nav class="shg-tabs">
      <div class="page-shell shg-tabs-inner">
        <button type="button" class="shg-tab active" data-tab="items">Items</button>
      </div>
    </nav>

    <main class="page-shell">
      <section class="shg-panel active" data-panel="items">
        <div class="catalog-toolbar">
          <input
            id="itemsSearchInput"
            class="catalog-search-input"
            type="search"
            placeholder="Search items..."
          />
          <select id="itemsCategoryFilter" class="catalog-filter-select">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div id="catalogGrid" class="shg-catalog-grid"></div>
        <p id="itemsEmptyState" class="subtext" hidden>No items match your filters.</p>
      </section>
    </main>

    <div id="consumerToast" class="shg-toast" hidden></div>

    <script>
      document.body.dataset.page = 'consumer-dashboard';
    </script>
    <script src="script.js"></script>
    <script src="chatbot-widget.js" defer></script>
  </body>
</html>
