<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi - An innovative SHG intelligent assistant</title>
    <link rel="icon" type="image/png" href="/interface/favicon.png" />
    <link rel="stylesheet" href="/interface/styles.css" />
  </head>
  <body class="shg-page">
    <nav id="dashboard-tabs-nav" class="shg-tabs">
      <div class="page-shell shg-tabs-inner">
        <button id="tab-raw-materials" type="button" class="shg-tab" data-tab="raw-materials">Items</button>
        <button id="tab-catalog" type="button" class="shg-tab" data-tab="catalog">Catalog</button>
        <button
          id="tab-insights"
          type="button"
          class="shg-tab shg-tab-disabled"
          data-tab="insights"
          title="Deprecated — moving to chatbot"
        >
          Insights
        </button>
        <button
          id="tab-contributions"
          type="button"
          class="shg-tab shg-tab-disabled"
          data-tab="contributions"
          title="Open Contributions — Coming Soon"
        >
          Open Contributions
        </button>
        <!-- Not a real tab a member picks from this bar (which is itself
             CSS-hidden — see .shg-tabs) — apps/web's DashboardProfileMenu
             forwards its own icon's click to this button (see
             LandingPage.tsx's handleOpenProfilePage), reusing the same
             tab/panel switching interface/script.js already has instead of
             a separate mechanism. Excluded from DashboardNav's own visible
             tab list (see DashboardNav.tsx's visibleTabs filter). -->
        <button id="tab-profile" type="button" class="shg-tab active" data-tab="profile">Profile</button>
      </div>
    </nav>

    <main class="page-shell">
      <section id="panel-raw-materials" class="shg-panel" data-panel="raw-materials">
        <div id="rawMaterialsGrid" class="shg-catalog-grid"></div>
        <p id="itemsEmptyState" class="subtext" hidden>No items available.</p>
      </section>

      <section id="panel-catalog" class="shg-panel" data-panel="catalog">
        <form id="addProductForm" class="add-product-card card" novalidate>
          <div class="add-product-fields">
            <div class="add-product-columns">
              <div class="add-product-col">
                <div class="field">
                  <label for="newProductName">Product Name</label>
                  <input type="text" id="newProductName" placeholder="Name" required />
                </div>
                <div class="field">
                  <label for="newProductCategory">Product Category</label>
                  <input type="text" id="newProductCategory" placeholder="Category" required />
                </div>
              </div>
              <div class="add-product-col">
                <div class="field">
                  <label for="newProductMfgDate">Mfg. Date</label>
                  <input type="text" id="newProductMfgDate" placeholder="YYYY-MM-DD" required />
                </div>
                <div class="field">
                  <label for="newProductExpiry">Exp. Date</label>
                  <input type="text" id="newProductExpiry" placeholder="YYYY-MM-DD" />
                </div>
              </div>
              <div class="add-product-col">
                <div class="field">
                  <label for="newProductMrp">MRP / Unit (₹)</label>
                  <input type="number" id="newProductMrp" step="any" min="0" placeholder="01.10" required />
                </div>
                <div class="field">
                  <label for="newProductUnits">No. of Units</label>
                  <input type="number" id="newProductUnits" step="1" min="0" placeholder="1" required />
                </div>
              </div>
              <div class="add-product-col">
                <div class="field">
                  <label for="newProductMinQty">Min. Qty. / Order</label>
                  <input type="number" id="newProductMinQty" step="1" min="1" placeholder="1" required />
                </div>
                <div class="field">
                  <label for="newProductMaxQty">Max. Qty. / Order</label>
                  <input type="number" id="newProductMaxQty" step="1" min="1" placeholder="1" required />
                </div>
              </div>
            </div>
            <div class="field">
              <label for="newProductDescription">Product Description</label>
              <input type="text" id="newProductDescription" placeholder="Description" required />
            </div>
          </div>

          <label id="newProductUploadZone" class="add-product-upload" for="newProductImage">
            <input type="file" id="newProductImage" accept="image/*" hidden />
            <span class="add-product-upload-badge" aria-hidden="true">
              <!-- Catalog icon (a coin, its inner ring a fillRule="evenodd"
                   cutout) — mirrors CatalogIcon.tsx in apps/web, this
                   dashboard's own placeholder per the Retailer=Commodity /
                   SHG=Catalog split. -->
              <svg class="add-product-upload-icon" viewBox="0 0 20 20" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M10 17a7 7 0 1 0 0-14a7 7 0 1 0 0 14ZM10 13.5a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7Z"
                  fill="currentColor"
                />
              </svg>
            </span>
          </label>

          <div class="add-product-confirm-overlay" aria-hidden="true">
            <button id="add-product-confirm-button" type="button" class="add-product-confirm-btn confirm" aria-label="Add product">+</button>
            <button id="add-product-cancel-button" type="button" class="add-product-confirm-btn cancel" aria-label="Discard">&minus;</button>
          </div>
        </form>

        <hr class="add-product-divider" />

        <div id="catalogGrid" class="shg-catalog-grid"></div>
      </section>

      <section id="panel-insights" class="shg-panel" data-panel="insights">
        <div class="field shg-insight-select-field">
          <div class="shg-multiselect">
            <button
              type="button"
              id="insightSelectToggle"
              class="shg-multiselect-toggle"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Select products"
            >
              <span id="insightSelectSummary" class="shg-multiselect-summary">Select products</span>
              <span class="shg-multiselect-chevron" aria-hidden="true">&#9662;</span>
            </button>
            <div id="insightSelectOptions" class="shg-multiselect-panel" role="listbox" aria-multiselectable="true" hidden></div>
          </div>
        </div>
        <div id="insightPanel" class="card shg-insight-panel"></div>
      </section>

      <section id="panel-profile" class="shg-panel active" data-panel="profile">
        <div class="auth-card profile-panel-card">
          <div class="form-grid">
            <div class="field">
              <img id="profileAvatar" src="/guest-avatar.svg" alt="" class="profile-avatar" />
            </div>
            <div class="field">
              <label>Email</label>
              <input id="profileEmail" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Passkey</label>
              <input id="profilePasskey" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Role</label>
              <input id="profileRole" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Mode</label>
              <input id="profileMode" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Name</label>
              <input id="profileName" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Contact</label>
              <input id="profileContact" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Address</label>
              <input id="profileAddress" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Pincode</label>
              <input id="profilePincode" type="text" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label>Nationality</label>
              <input id="profileNationality" type="text" readonly tabindex="-1" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="shgToast" class="shg-toast" hidden></div>

    <script>
      document.body.dataset.page = 'shg-dashboard';
    </script>
    <script src="/interface/script.js"></script>
  </body>
</html>
