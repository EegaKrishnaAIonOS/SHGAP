<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi - An innovative SHG intelligent assistant</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chatbot-widget.css" />
  </head>
  <body class="shg-page rt-page">
    <header class="rt-navbar">
      <div class="rt-navbar-inner">
        <div class="shg-greeting">
          <span class="shg-greeting-word">hello,</span>
          <span class="shg-brand">Sri Lakshmi Traders</span>
        </div>
        <img
          class="rt-avatar"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRQ2c7Xyvn2hZVZ4CFSOsRNJJXnZ2X3prKrNgDCs7ICg&s"
          alt="User profile"
          title="Sri Lakshmi Traders &middot; Wholesale Supplier"
        />
      </div>
    </header>

    <nav class="shg-tabs">
      <div class="page-shell shg-tabs-inner">
        <button type="button" class="shg-tab active" data-tab="catalog">Catalog</button>
      </div>
    </nav>

    <main class="page-shell">
      <section class="shg-panel active" data-panel="catalog">
        <div id="materialGrid" class="shg-catalog-grid"></div>
      </section>
    </main>

    <script>
      document.body.dataset.page = 'retailer-dashboard';
    </script>
    <script src="script.js"></script>
    <script src="chatbot-widget.js" defer></script>
  </body>
</html>
