<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi - An innovative SHG intelligent assistant</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chatbot-widget.css" />
  </head>
  <body class="shg-page">
    <header class="shg-navbar">
      <div class="shg-navbar-inner">
        <div class="shg-greeting">
          <span class="shg-greeting-word">hello,</span>
          <span class="shg-brand">Krishna KS Lakshmi SHG</span>
        </div>
        <img
          class="shg-avatar"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRQ2c7Xyvn2hZVZ4CFSOsRNJJXnZ2X3prKrNgDCs7ICg&s"
          alt="User profile"
          title="Krishna KS Lakshmi SHG"
        />
      </div>
    </header>

    <nav class="shg-tabs">
      <div class="page-shell shg-tabs-inner">
        <button type="button" class="shg-tab" data-tab="raw-materials">Items</button>
        <button type="button" class="shg-tab active" data-tab="catalog">Catalog</button>
        <button type="button" class="shg-tab" data-tab="insights">Insights</button>
        <button
          type="button"
          class="shg-tab shg-tab-disabled"
          data-tab="contributions"
          title="Coming Soon"
        >
          Open Contributions
        </button>
      </div>
    </nav>

    <main class="page-shell">
      <section class="shg-panel" data-panel="raw-materials">
        <div class="catalog-toolbar">
          <input
            id="itemsSearchInput"
            class="catalog-search-input"
            type="search"
            placeholder="Search items..."
          />
          <select id="itemsCategoryFilter" class="catalog-filter-select">
            <option value="all">All Categories</option>
          </select>
        </div>
        <div id="rawMaterialsGrid" class="shg-catalog-grid"></div>
        <p id="itemsEmptyState" class="subtext" hidden>No items match your filters.</p>
      </section>

      <section class="shg-panel active" data-panel="catalog">
        <div id="catalogGrid" class="shg-catalog-grid"></div>
      </section>

      <section class="shg-panel" data-panel="insights">
        <div class="field shg-insight-select-field">
          <div class="shg-multiselect">
            <button
              type="button"
              id="insightSelectToggle"
              class="shg-multiselect-toggle"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Select products"
            >
              <span id="insightSelectSummary" class="shg-multiselect-summary">Select products</span>
              <span class="shg-multiselect-chevron" aria-hidden="true">&#9662;</span>
            </button>
            <div id="insightSelectOptions" class="shg-multiselect-panel" role="listbox" aria-multiselectable="true" hidden></div>
          </div>
        </div>
        <div id="insightPanel" class="card shg-insight-panel"></div>
      </section>
    </main>

    <div id="shgToast" class="shg-toast" hidden></div>

    <script>
      document.body.dataset.page = 'shg-dashboard';
    </script>
    <script src="script.js"></script>
    <script src="chatbot-widget.js" defer></script>
  </body>
</html>
