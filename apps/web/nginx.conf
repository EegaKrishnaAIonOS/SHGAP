worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # T24/ADR-0033: the real reverse-proxy vite.config.ts's own comment
    # named as the intended production setup ("A real deployment would
    # front both with a single reverse proxy the same way") — same /api and
    # /voice-api same-origin prefixes, same path-prefix-stripping rewrite,
    # so httpClient.ts and the WebRTC signaling call work unchanged in
    # every environment. `core-api`/`voice-service` are plain hostnames,
    # resolved by Docker Compose's or Kubernetes' own internal DNS — this
    # file doesn't otherwise know or care which one it's running under.
    location /api/ {
      proxy_pass http://core-api:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /voice-api/ {
      proxy_pass http://voice-service:8002/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebRTC signaling itself is a plain POST (see vite.config.ts's own
      # comment) — no special Upgrade/Connection headers needed here.
    }

    # React Router client-side routing — any path nginx doesn't otherwise
    # recognize falls back to index.html so the SPA's own router handles it,
    # instead of a raw nginx 404 on a hard refresh of e.g. /dashboards/shg.
    location / {
      try_files $uri $uri/ /index.html;
    }

    location = /health {
      access_log off;
      return 200 "ok\n";
    }
  }
}
