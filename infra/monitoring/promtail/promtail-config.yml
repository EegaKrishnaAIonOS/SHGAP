# T24/ADR-0033: real container-log shipping — Promtail auto-discovers every
# container on the Docker host via the Docker socket (bind-mounted in
# docker-compose.monitoring.yml), reads its json-file log driver output, and
# labels each stream by the container's compose service/project name so
# Grafana's Loki panel can filter by them (see shgap-overview.json).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
