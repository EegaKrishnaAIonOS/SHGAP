# T24/ADR-0033: real Prometheus config — scrapes the /metrics endpoint every
# one of the 4 backend services now exposes (see apps/*/src/metrics or
# apps/*/app/main.py's Instrumentator wiring). Targets are Docker Compose
# service names, since this runs on the same network as
# infra/docker-compose.apps.yml — the same file, unmodified, is what a real
# Kubernetes deployment's Prometheus would use too, just with a
# `kubernetes_sd_configs` discovery block instead of these static targets
# (see infra/k8s/monitoring/ for that version).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: core-api
    static_configs:
      - targets: ["core-api:3000"]

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:3001"]

  - job_name: ml-services
    static_configs:
      - targets: ["ml-services:8001"]

  - job_name: voice-service
    static_configs:
      - targets: ["voice-service:8002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
