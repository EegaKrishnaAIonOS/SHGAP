# T24/ADR-0033: real alert rules against the metrics actually exposed —
# not placeholders. `ResponseTimeSLOBreached` ties directly to the sprint
# plan's own "<3s average response" target (T23/ADR-0032 already validated
# this once via k6; this is the same threshold, now watched continuously).
groups:
  - name: shgap-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} for 1 minute. See the runbook: docs/runbooks/service-down.md"

      - alert: ResponseTimeSLOBreached
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (job, le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} p95 response time above the 3s target"
          description: "p95 request duration for {{ $labels.job }} has exceeded 3s for 5 minutes — the same threshold T23/ADR-0032's load test validated. See docs/runbooks/slow-responses.md"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (job)
            /
            sum(rate(http_requests_total[5m])) by (job)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 5xx rate above 5%"
          description: "More than 5% of {{ $labels.job }}'s requests have returned 5xx over the last 5 minutes. See docs/runbooks/high-error-rate.md"

  - name: shgap-notifications
    rules:
      - alert: NotificationDeliveryFailureRateHigh
        expr: |
          (
            sum(rate(notification_jobs_total{outcome="failure"}[15m]))
            /
            sum(rate(notification_jobs_total[15m]))
          ) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of notification jobs are failing"
          description: "Real SMS/WhatsApp/voice/email delivery failures over the last 15 minutes exceed 20% of total jobs — check the relevant provider's status page and credentials. See docs/runbooks/notification-failures.md"
