apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: shgap
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports: [{ containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {} # real deployment: an S3 bucket via Loki's own object_store config (see infra/monitoring/loki/loki-config.yml's comment), not local disk.
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: shgap
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
---
# Content identical to infra/monitoring/loki/loki-config.yml — see that
# file's own comment for the filesystem-storage/single-process rationale,
# and kustomization.yaml's header comment for why this is a duplicated
# inline copy rather than a generated-from-that-file reference.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: shgap
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: false
---
# T24/ADR-0033: a DaemonSet, not a Deployment — one Promtail per node, same
# as the Docker Compose rehearsal's single Promtail reading the whole
# Docker host's container logs, generalized to "every node this cluster
# ever schedules a pod onto."
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: shgap
spec:
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args: ["-config.file=/etc/promtail/config.yml"]
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
      volumes:
        - name: config
          configMap: { name: promtail-k8s-config }
        - name: pods
          hostPath: { path: /var/log/pods }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: shgap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: shgap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-k8s-config
  namespace: shgap
data:
  # Reads /var/log/pods (kubelet's own per-container log directory) instead
  # of the Docker-socket-based discovery infra/monitoring/promtail/ uses —
  # the Kubernetes-native equivalent, using pod metadata for the same
  # compose_service-style labels the shgap-overview dashboard filters by.
  config.yml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: compose_service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
