# T24/ADR-0033: a REAL, applyable Secret manifest shape — but with
# placeholder values, never committed with real ones (same rule this repo
# has followed since T02's very first .env.example). This file's name ends
# in `.example.yaml` deliberately so `kubectl apply -f infra/k8s/base/`
# (which globs every *.yaml file) never accidentally applies placeholder
# secrets over real ones — see docs/deployment-guide.md for the actual
# command that generates the real `secrets.yaml` this file is a template
# for, e.g.:
#   kubectl create secret generic core-api-secrets -n shgap \
#     --from-literal=DATABASE_URL="$(terraform -chdir=infra/terraform output -raw database_url)" \
#     ...
# or, in a real cluster, an External Secrets Operator `ExternalSecret`
# resource pointing at the same AWS Secrets Manager entries
# infra/terraform/modules/secrets provisions — preferred over `kubectl
# create secret` for anything past a first manual bootstrap, since it keeps
# the cluster's secret values in sync with Secrets Manager automatically.
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secrets
  namespace: shgap
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE:REPLACE@REPLACE:5432/shgap?schema=public"
  REDIS_URL: "redis://REPLACE:6379"
  JWT_ACCESS_SECRET: "REPLACE_WITH_A_REAL_64_CHAR_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_A_REAL_64_CHAR_SECRET"
  PII_ENCRYPTION_KEY: "REPLACE_WITH_A_REAL_KEY"
  MINIO_ACCESS_KEY: "REPLACE"
  MINIO_SECRET_KEY: "REPLACE"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: shgap
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE:REPLACE@REPLACE:5432/shgap"
  REDIS_URL: "redis://REPLACE:6379"
  MSG91_AUTH_KEY: ""
  MSG91_SENDER_ID: ""
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_PHONE_NUMBER_ID: ""
  EXOTEL_ACCOUNT_SID: ""
  EXOTEL_API_KEY: ""
  EXOTEL_API_TOKEN: ""
  EXOTEL_CALLER_ID: ""
  EXOTEL_VOICE_APPLET_URL: ""
  AWS_SES_REGION: ""
  SES_FROM_EMAIL: ""
---
apiVersion: v1
kind: Secret
metadata:
